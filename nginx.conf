server {
  listen 80;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  location = /expediente11 { return 301 /expediente11/; }
  location = /navidad { return 301 /navidad/; }
  location ~ ^/navidad-extra/?$ { return 302 "https://drive.google.com/uc?export=download&id=1GldZq5fGKAhcHtCW5U2G8ns61718kWuX"; }
  location ~ ^/explicaciones/?$ { return 302 "https://drive.google.com/uc?export=download&id=1lZ-vXX2khXj2uJhkAxQ0RlQZD2uWpd_K"; }
  location / { try_files $uri $uri/ =404; }
}
